<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>서강챗봇 메인</title>
    <style>
        body {
            font-family: '맑은 고딕', sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

            .container h1 {
                margin-bottom: 30px;
            }

        .btn {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            font-size: 16px;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.3s;
        }

            .btn:hover {
                background-color: #005a99;
            }
    </style>
</head>
<body>
    <div class="container">
        <h1>포켓서강 시스템</h1>
        <a href="Register.aspx" class="btn">회원가입</a>
        <a href="Login.aspx" class="btn">로그인</a>
    </div>
</body>
</html>
